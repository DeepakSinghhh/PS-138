# Render Blueprint: free web service built from the Dockerfile (dashboard + API in one container).
# Deploy: https://render.com/deploy?repo=https://github.com/DeepakSinghhh/PS-138
services:
  - type: web
    name: q-greenfleet
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      # precompute the default scenario's runs at start-up, so a first visitor never waits
      - key: GREENFLEET_WARMUP
        value: "1"
      # the free instance has 0.1 CPU: cap optimizer evaluations per request
      - key: GREENFLEET_MAX_BUDGET
        value: "20000"
