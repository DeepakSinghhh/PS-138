    beaufort: 4.5
    delay_mean: 0.02
    delay_sd: 0.05
    port_delay_sd_h: 8
    eu_scope: 1.0
    classes: [PANAMAX_C, NEOPANAMAX_C]
  - id: E03
    name: Barcelona - Genoa (Ro-Pax)
    ports: [BARCELONA, GENOA]
