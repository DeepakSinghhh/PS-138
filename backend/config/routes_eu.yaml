# EU-trade scenario: exercises FuelEU Maritime pooling and EU ETS
# (intra-EU voyages are 100 % in scope, extra-EU voyages 50 %).
name: EU trade network
description: >
  Six services touching EU ports, mixing intra-EU short-sea (100 % FuelEU / ETS
  scope) with extra-EU deep-sea trades (50 % scope).
routes:
  - id: E01
    name: Rotterdam - Gothenburg feeder
    ports: [ROTTERDAM, GOTHENBURG]
    service: liner
    cargo: container
    demand: 1400
    load_factor: 0.85
    port_hours: 30
    beaufort: 4.5
    delay_mean: 0.02
    delay_sd: 0.05
    port_delay_sd_h: 6
    eu_scope: 1.0
    classes: [FEEDER, PANAMAX_C]
  - id: E02
    name: Hamburg - Algeciras
    ports: [HAMBURG, ALGECIRAS]
    service: liner
    cargo: container
    demand: 4000
    load_factor: 0.85
