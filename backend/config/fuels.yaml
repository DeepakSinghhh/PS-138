    family: ammonia
    pathway: fossil
    lcv_mj_per_g: 0.0186
    cf_co2: 0.0
    cf_ch4: 0.0
    cf_n2o: 0.00010
    wtt_g_per_mj: 121.0
    slip: 0.0
    pilot_share: 0.08
    rfnbo: false
    source: FuelEU Annex II (WtT); N2O scenario assumption
  AMMONIA_BLUE:
    label: Ammonia (blue, CCS)
    family: ammonia
    pathway: blue
    lcv_mj_per_g: 0.0186
    cf_co2: 0.0
    cf_ch4: 0.0
    cf_n2o: 0.00010
    wtt_g_per_mj: 40.0
    slip: 0.0
    pilot_share: 0.08
    rfnbo: false
