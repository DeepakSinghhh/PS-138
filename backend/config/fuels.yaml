    family: methanol
    pathway: fossil
    lcv_mj_per_g: 0.0199
    cf_co2: 1.375
    cf_ch4: 0.0
    cf_n2o: 0.0
    wtt_g_per_mj: 31.3
    slip: 0.0
    pilot_share: 0.05
    rfnbo: false
    source: FuelEU Annex II
  METHANOL_BIO:
    label: Bio-methanol
    family: methanol
    pathway: bio
    lcv_mj_per_g: 0.0199
    cf_co2: 1.375
    cf_ch4: 0.0
    cf_n2o: 0.0
    wtt_g_per_mj: -52.0
    slip: 0.0
    pilot_share: 0.05
    rfnbo: false
