# India coastal & near-sea network (flagship case study).
#
# Each route is a two-port shuttle (round trip = 2 x one-way sea distance).
# Distances are computed with the `searoute` maritime network unless
# `distance_nm` is given.
#   service: liner  -> demand is cargo units per WEEK and at least one sailing per week
#            tramp  -> demand is cargo units per YEAR, laden out / ballast back
#   port_hours:   total port + manoeuvring time per round trip
#   beaufort:     mean sea state on the route (monsoon-weighted)
#   delay_*:      schedule-disturbance model (fraction of sea time; port hours)
#   eu_scope:     share of energy in FuelEU / EU ETS scope (1 intra-EU, 0.5 extra-EU)
# Demand figures are illustrative, sized to represent realistic services.

name: India coastal & near-sea network
