# Vessel-class library used by the fleet optimizer and the synthetic data generator.
#
# Calm-water propulsion power at design speed and design draft is taken as
# 75 % of MCR (a common sea-trial convention); in service, the weather and
# fouling factors (see physics/propulsion.py) bring the engine to ~85-90 % MCR.
# Dimensions and powers are representative values for each class, cross-checked
# against typical EU-MRV fuel-per-distance figures; charter rates are 2026
# scenario defaults (USD/day, conventional ship).
#
# capacity: cargo units the class carries (TEU, tonnes of cargo, or passengers)
# cii_type: key into regulations.yaml -> cii.ship_types

