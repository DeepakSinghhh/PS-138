# Ports: coordinates (lon, lat), country (for grid factor / electricity price),
# onshore power supply (OPS) availability year, and bunkering availability per fuel
# (first year the fuel can be bunkered). Conventional fuels (HFO/VLSFO/MGO) are
# available everywhere. Alternative-fuel years are scenario assumptions based on
# announced projects (Singapore & Rotterdam multi-fuel hubs; India's green-hydrogen
# hubs at Deendayal/Kandla, V.O. Chidambaranar/Tuticorin and Paradip; LNG terminals
# at Kochi, Dahej and Mundra) and can be edited in the UI.

default_bunkers:
  HFO: 2020
  VLSFO: 2020
  MGO: 2020

