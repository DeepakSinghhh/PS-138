name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check greenfleet tests
      - name: Test
        run: python -m pytest -m "not slow"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build   # tsc strict type-check + vite build

  docker:
    # Same image Hugging Face Spaces builds; also checks that the container starts and serves the app.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t qgreenfleet .
      - name: Smoke-test the container
        run: |
          docker run -d --name qgf -p 8000:8000 qgreenfleet
          for i in $(seq 1 60); do curl -sf http://localhost:8000/api/health && break; sleep 2; done
          curl -sf http://localhost:8000/api/health
          curl -sf http://localhost:8000/ | grep -qi "<div id=\"root\""
          curl -sf http://localhost:8000/api/meta > /dev/null
          echo "container OK"
      - name: Container logs
        if: always()
        run: docker logs qgf || true
