name: Deploy to Hugging Face Spaces

# Publishes the dashboard + API as a Docker Space (free CPU: 2 vCPU, 16 GB RAM).
# One-time setup in GitHub -> Settings -> Secrets and variables -> Actions:
#   secret   HF_TOKEN  = a Hugging Face access token with "Write" permission
#   variable HF_SPACE  = optional, defaults to Deepak1279/q-greenfleet (the Space is created if it does not exist)
# The live app is then at https://deepak1279-q-greenfleet.hf.space

on:
  push:
    branches: [main, claude/friendly-volta-smzf8i]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: cfg
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE || 'Deepak1279/q-greenfleet' }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::Not deploying: add the HF_TOKEN secret (see the top of this workflow)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble the Space bundle
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir -p space
          cp Dockerfile space/
          cp -r backend data frontend space/
          mkdir -p space/docs space/reports
          cp docs/*.md space/docs/
          cp reports/*.md reports/*.json space/reports/
          cp -r reports/figures space/reports/
          rm -rf space/frontend/node_modules space/frontend/dist space/frontend/tests space/backend/tests space/backend/.venv
          find space -name "__pycache__" -type d -prune -exec rm -rf {} +
          cat > space/README.md <<'EOF'
          ---
          title: Q-GreenFleet
          emoji: 🚢
          colorFrom: green
          colorTo: blue
          sdk: docker
          app_port: 8000
          pinned: true
          short_description: Quantum-inspired fuel prediction & green fleet optimization
          ---

          # Q-GreenFleet

          SIH 2026 · Problem statement 26138 (Egreen Quanta): quantum-inspired fuel consumption prediction and
          green fleet optimization. Source code, benchmarks and docs: https://github.com/DeepakSinghhh/PS-138
          EOF
          du -sh space

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: "3.11"

      - name: Upload to the Space
        if: steps.cfg.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE || 'Deepak1279/q-greenfleet' }}
        run: |
          pip install -q "huggingface_hub>=0.25"
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"].strip()
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(repo_id=space, repo_type="space", folder_path="space", delete_patterns="*",
                            commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]} from GitHub")
          user, name = space.split("/")
          url = f"https://{user.lower()}-{name.lower().replace('_', '-').replace('.', '-')}.hf.space"
          print(f"Deployed. Build logs: https://huggingface.co/spaces/{space}  Live app (after the build): {url}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### Deployed to Hugging Face\n\n- Live app: {url}\n- Space and build logs: https://huggingface.co/spaces/{space}\n")
          EOF
